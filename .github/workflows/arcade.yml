name: Update GIT INVADERS arcade

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_arcade.py"
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ZacharyTChung
        run: python scripts/generate_arcade.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GIT INVADERS arcade"
          file_pattern: assets/git-invaders.svg
